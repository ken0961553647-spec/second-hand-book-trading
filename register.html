<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手書交易平台 - 帳號註冊</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>建立新帳號</h1>
                <p>加入校園二手書交易平台</p>
            </div>
            
            <div id="error-message" style="color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; display: none;"></div>

            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <label for="account">學號 / 學校信箱</label>
                    <input type="text" id="account" placeholder="請輸入學號或信箱" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">設定密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="請輸入密碼" required autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)" title="顯示/隱藏密碼">👁️</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">確認密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" placeholder="請再次輸入密碼" required autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)" title="顯示/隱藏密碼">👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-btn">註冊</button>
                
                <div class="form-footer">
                    <p>已經有帳號了？ <a href="accountlogin.html" class="register-link">立即登入</a></p>
                </div>
            </form>
        </div>
        
        <div class="decoration shape-1"></div>
        <div class="decoration shape-2"></div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
