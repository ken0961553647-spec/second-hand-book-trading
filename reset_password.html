<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手書交易平台 - 重設密碼</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>重設密碼</h1>
                <p>請輸入您收到的 6 位數驗證碼與新密碼</p>
            </div>
            
            <div id="error-message" style="color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; display: none;"></div>

            <form id="resetForm" class="login-form">
                <div class="input-group">
                    <label for="code">6 位數驗證碼</label>
                    <input type="text" id="code" placeholder="請輸入 6 位數驗證碼" required maxlength="6" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="new_password">新密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="new_password" placeholder="請輸入新密碼" required autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('new_password', this)" title="顯示/隱藏密碼">👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-btn">確認重設</button>
                
                <div class="form-footer">
                    <p><a href="accountlogin.html" class="register-link">返回登入</a></p>
                </div>
            </form>
        </div>
        
        <div class="decoration shape-1"></div>
        <div class="decoration shape-2"></div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
