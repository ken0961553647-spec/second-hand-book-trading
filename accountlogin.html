<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手書交易平台 - 會員登入</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- CSS 路徑改為相對路徑 -->
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>逢甲大學二手書交易網站</h1>
                <p>校園二手書交易平台</p>
            </div>
            
            <!-- 錯誤提示區塊，由 JS 控制顯示與隱藏 -->
            <div id="error-message" style="color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; display: none;"></div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="account">學號 / 學校信箱</label>
                    <input type="text" id="account" placeholder="請輸入學號或信箱" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="請輸入密碼" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)" title="顯示/隱藏密碼">👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-btn">登入</button>
                
                <div class="form-footer">
                    <a href="forgot_password.html" class="forgot-pwd">忘記密碼？</a>
                    <p>還沒有帳號？ <a href="register.html" class="register-link">立即註冊</a></p>
                </div>
            </form>
        </div>
        
        <div class="decoration shape-1"></div>
        <div class="decoration shape-2"></div>
    </div>
    
    <!-- 引入自訂 JS 處理邏輯 -->
    <script src="js/auth.js"></script>
</body>
</html>
