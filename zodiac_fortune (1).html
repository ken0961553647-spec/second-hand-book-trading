<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星象占卜 - 十二星座每日運勢</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1b2735 0%, #090a0f 100%);
            --accent: #d4af37; /* 金色 */
            --accent-glow: rgba(212, 175, 55, 0.5);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Serif TC', serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景星空特效 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: transparent;
        }

        /* 產生星星粒子 */
        .stars::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 200px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 250px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 50px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: moveStars 60s linear infinite;
            opacity: 0.6;
        }

        @keyframes moveStars {
            from { transform: translateY(0); }
            to { transform: translateY(-350px); }
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        main {
            width: 100%;
            max-width: 1000px;
            padding: 1rem 2rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 視圖切換 */
        .view {
            display: none;
            width: 100%;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 星座選擇網格 */
        .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.5rem;
            width: 100%;
            margin-top: 2rem;
        }

        .zodiac-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .zodiac-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .zodiac-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        .zodiac-card:hover::before {
            opacity: 1;
        }

        .zodiac-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #d4af37, #fde08b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(212,175,55,0.4));
        }

        .zodiac-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .zodiac-dates {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
        }

        /* 洗牌/占卜中動畫 */
        #view-loading {
            min-height: 400px;
            justify-content: center;
        }

        .crystal-ball {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(150, 100, 255, 0.4), rgba(0,0,50,0.9));
            box-shadow: 0 0 30px rgba(150, 100, 255, 0.6), inset 0 0 20px rgba(255,255,255,0.5);
            animation: float 4s ease-in-out infinite, pulseGlow 2s alternate infinite;
            margin-bottom: 2rem;
            position: relative;
        }

        .crystal-ball::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 20%;
            width: 60%;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            filter: blur(4px);
            animation: shadowPulse 4s ease-in-out infinite;
        }

        .loading-text {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 3px;
            animation: blink 1.5s infinite;
        }

        /* 占卜結果卡片 */
        #view-result {
            max-width: 600px;
            width: 100%;
        }

        .result-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.5) 100%);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px var(--accent-glow);
            backdrop-filter: blur(15px);
            position: relative;
        }

        .result-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(212,175,55,0.3);
        }

        .selected-sign-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #d4af37, #fde08b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-title {
            font-size: 2rem;
            color: var(--accent);
            font-weight: 900;
        }

        .fortune-score {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 1rem;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .fortune-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            text-align: left;
            margin-bottom: 2.5rem;
        }

        .fortune-item {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 1.2rem;
            border-left: 4px solid var(--accent);
        }

        .fortune-label {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .fortune-text {
            color: var(--text-main);
            line-height: 1.6;
            font-size: 1rem;
        }

        .lucky-box {
            display: flex;
            justify-content: space-around;
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        .lucky-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .lucky-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.2rem;}
        .lucky-value { font-size: 1.1rem; color: var(--accent); font-weight: 600;}

        .btn {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* 動畫定義 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes shadowPulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 30px rgba(150, 100, 255, 0.4), inset 0 0 20px rgba(255,255,255,0.3); }
            to { box-shadow: 0 0 50px rgba(150, 100, 255, 0.8), inset 0 0 30px rgba(255,255,255,0.6); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 媒體查詢 */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .zodiac-grid { grid-template-columns: repeat(2, 1fr); }
            .result-card { padding: 2rem 1.2rem; }
            .fortune-details { gap: 1rem; }
            .lucky-box { flex-direction: column; gap: 1rem; text-align: center; }
        }
        @media (max-width: 480px) {
            .zodiac-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <header>
        <h1>✨ 星象占卜 ✨</h1>
        <p>探索宇宙傳遞給你的專屬訊息</p>
    </header>

    <main>
        <!-- 【 步驟一：選擇星座 】 -->
        <div id="view-select" class="view active">
            <h2 style="font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 1rem;">請選擇你的所屬星座</h2>
            
            <div class="zodiac-grid" id="zodiac-container">
                <!-- 由 JavaScript 產生 -->
            </div>
        </div>

        <!-- 【 步驟二：占卜讀取中 】 -->
        <div id="view-loading" class="view">
            <div class="crystal-ball"></div>
            <div class="loading-text">星層解密中...</div>
        </div>

        <!-- 【 步驟三：占卜結果 】 -->
        <div id="view-result" class="view">
            <div class="result-card">
                <div class="result-header">
                    <div class="selected-sign-icon" id="res-icon">♈</div>
                    <div class="result-title" id="res-name">牡羊座</div>
                    <div class="fortune-score" id="res-score">
                        ★ ★ ★ ★ ☆
                    </div>
                </div>

                <div class="lucky-box">
                    <div class="lucky-item">
                        <span class="lucky-label">幸運色</span>
                        <span class="lucky-value" id="res-color">海軍藍</span>
                    </div>
                    <div class="lucky-item">
                        <span class="lucky-label">幸運數字</span>
                        <span class="lucky-value" id="res-number">7</span>
                    </div>
                    <div class="lucky-item">
                        <span class="lucky-label">速配星座</span>
                        <span class="lucky-value" id="res-match">天秤座</span>
                    </div>
                </div>

                <div class="fortune-details">
                    <div class="fortune-item">
                        <div class="fortune-label">🌟 整體運勢</div>
                        <div class="fortune-text" id="fc-overall">加載中...</div>
                    </div>
                    <div class="fortune-item">
                        <div class="fortune-label">💖 愛情運勢</div>
                        <div class="fortune-text" id="fc-love">加載中...</div>
                    </div>
                    <div class="fortune-item">
                        <div class="fortune-label">💼 事業運勢</div>
                        <div class="fortune-text" id="fc-career">加載中...</div>
                    </div>
                    <div class="fortune-item">
                        <div class="fortune-label">💰 財富運勢</div>
                        <div class="fortune-text" id="fc-wealth">加載中...</div>
                    </div>
                </div>

                <button class="btn" onclick="resetDivination()">重新占卜</button>
            </div>
        </div>
    </main>

    <script>
        const zodiacSigns = [
            { id: 'aries', name: '牡羊座', icon: '♈', dates: '3/21 - 4/19' },
            { id: 'taurus', name: '金牛座', icon: '♉', dates: '4/20 - 5/20' },
            { id: 'gemini', name: '雙子座', icon: '♊', dates: '5/21 - 6/20' },
            { id: 'cancer', name: '巨蟹座', icon: '♋', dates: '6/21 - 7/22' },
            { id: 'leo', name: '獅子座', icon: '♌', dates: '7/23 - 8/22' },
            { id: 'virgo', name: '處女座', icon: '♍', dates: '8/23 - 9/22' },
            { id: 'libra', name: '天秤座', icon: '♎', dates: '9/23 - 10/22' },
            { id: 'scorpio', name: '天蠍座', icon: '♏', dates: '10/23 - 11/21' },
            { id: 'sagittarius', name: '射手座', icon: '♐', dates: '11/22 - 12/21' },
            { id: 'capricorn', name: '魔羯座', icon: '♑', dates: '12/22 - 1/19' },
            { id: 'aquarius', name: '水瓶座', icon: '♒', dates: '1/20 - 2/18' },
            { id: 'pisces', name: '雙魚座', icon: '♓', dates: '2/19 - 3/20' },
        ];

        // 隨機運勢文本庫 (模擬不同情境)
        const fortuneTexts = {
            overall: [
                "今天星象對你十分有利，心想事成的機率極高。建議主動出擊，抓住眼前的每一個機會。",
                "平靜安穩的一天，適合沉澱心情，整理混亂的思緒。不要給自己太大的壓力。",
                "可能會遇到一些意想不到的小插曲，但只要保持冷靜與彈性，壞事也能變好事。",
                "貴人運極佳，遇到困難時不妨向周遭的朋友或長輩求助，將會獲得關鍵的指引。",
                "今天是充滿創造力的一天，靈感源源不絕。適合處理需要創意與發想的事物。"
            ],
            love: [
                "單身者有機會在意外的場合遇見心儀的對象；有伴侶者感情升溫，適合安排一場浪漫約會。",
                "在感情上需要更多的溝通與包容，避免因為小事而產生不必要的誤會。",
                "桃花運逐漸上揚，你的個人魅力將吸引周圍的人，盡情展現自信的一面吧。",
                "感情狀態平靜無波，可以花些時間經營共同的興趣，增進彼此的默契。",
                "多關注伴侶的情緒變化，一個不經意的貼心舉動就能讓他/她感動很久。"
            ],
            career: [
                "工作上能展現出色的領導力，獲得上司的賞識。有升遷或負責重要專案的可能。",
                "職場人際關係融洽，團隊合作順利，所有難題都能迎刃而解。",
                "建議在做決策時更加謹慎，多方參考資料後再下決定，避免衝動行事。",
                "這是一個適合進修或學習新技能的最佳時機，將為你的未來鋪下一條康莊大道。",
                "工作進度有些落後，試著重新安排優先順序，專注於最重要的事情上。"
            ],
            wealth: [
                "財星高照！有機會獲得一筆意外之財，或者過去的投資終於有了回報。",
                "財務狀況平穩，適合做好未來的理財規劃與儲蓄，避免不必要的衝動購物。",
                "近期可能會有較大的開銷出現，出門購物前最好先列好評單，克制消費慾望。",
                "若有投資打算，建議保守操作，選擇風險較低的標的，切勿聽信來路不明的小道消息。",
                "適合和懂理財的朋友交流，會獲得不錯的賺錢靈感或減少支出的秘訣。"
            ]
        };

        const colors = ["玫瑰金", "星空藍", "珍珠白", "翡翠綠", "珊瑚橘", "神祕紫", "大地棕", "芥末黃", "銀灰色", "曜石黑"];

        // 渲染星座卡片
        function initZodiacGrid() {
            const container = document.getElementById('zodiac-container');
            container.innerHTML = '';
            
            zodiacSigns.forEach(sign => {
                const card = document.createElement('div');
                card.className = 'zodiac-card';
                card.onclick = () => startDivination(sign);
                
                card.innerHTML = `
                    <div class="zodiac-icon">${sign.icon}</div>
                    <div class="zodiac-name">${sign.name}</div>
                    <div class="zodiac-dates">${sign.dates}</div>
                `;
                
                container.appendChild(card);
            });
        }

        // 切換視圖
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // 隨機選取陣列元素
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // 開始占卜流程
        function startDivination(sign) {
            // 切換到 Loading 畫面
            switchView('view-loading');
            
            // 延遲 2.5 秒後顯示結果（製造神秘占卜感）
            setTimeout(() => {
                generateResult(sign);
                switchView('view-result');
            }, 2500);
        }

        // 產生卜卦結果
        function generateResult(sign) {
            // 設定標頭
            document.getElementById('res-icon').textContent = sign.icon;
            document.getElementById('res-name').textContent = sign.name;
            
            // 隨機星級 (3 ~ 5星)
            const stars = Math.floor(Math.random() * 3) + 3; 
            let starHtml = '';
            for(let i=0; i<5; i++) {
                starHtml += i < stars ? '★ ' : '☆ ';
            }
            document.getElementById('res-score').textContent = starHtml.trim();

            // 幸運事物
            document.getElementById('res-color').textContent = getRandomItem(colors);
            document.getElementById('res-number').textContent = Math.floor(Math.random() * 100);
            
            // 速配星座 (排除自己)
            const matches = zodiacSigns.filter(s => s.id !== sign.id);
            document.getElementById('res-match').textContent = getRandomItem(matches).name;

            // 運勢文字
            document.getElementById('fc-overall').textContent = getRandomItem(fortuneTexts.overall);
            document.getElementById('fc-love').textContent = getRandomItem(fortuneTexts.love);
            document.getElementById('fc-career').textContent = getRandomItem(fortuneTexts.career);
            document.getElementById('fc-wealth').textContent = getRandomItem(fortuneTexts.wealth);
        }

        // 重新占卜
        function resetDivination() {
            switchView('view-select');
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            initZodiacGrid();
        });
    </script>
</body>
</html>
