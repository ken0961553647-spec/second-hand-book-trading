<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手書交易平台 - 忘記密碼</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>忘記密碼</h1>
                <p>請輸入您的學號 / 信箱以獲取 6 位數驗證碼</p>
            </div>
            
            <div id="error-message" style="color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; display: none;"></div>

            <form id="forgotForm" class="login-form">
                <div class="input-group">
                    <label for="account">學號 / 學校信箱</label>
                    <input type="text" id="account" placeholder="請輸入註冊時的學號或信箱" required autocomplete="username">
                </div>

                <button type="submit" class="login-btn">發送驗證碼</button>
                
                <div class="form-footer">
                    <p><a href="accountlogin.html" class="register-link">返回登入</a></p>
                </div>
            </form>
        </div>
        
        <div class="decoration shape-1"></div>
        <div class="decoration shape-2"></div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
