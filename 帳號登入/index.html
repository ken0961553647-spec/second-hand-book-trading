<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手書交易平台 - 首頁</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
    <style>
        .home-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.8);
            z-index: 2;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="home-container">
            <h1 id="welcome-message" style="margin-bottom: 20px;">歡迎來到首頁</h1>
            <p>您已成功登入校園二手書交易平台。</p>
            <br>
            <button id="logout-btn" class="login-btn" style="width: auto; padding: 10px 30px; background: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">登出</button>
        </div>
        <div class="decoration shape-1"></div>
        <div class="decoration shape-2"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                // 如果沒有登入，踢回登入頁
                window.location.href = 'accountlogin.html';
                return;
            }
            
            document.getElementById('welcome-message').textContent = `歡迎回來，${currentUser}！`;
            
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('currentUser');
                window.location.href = 'accountlogin.html';
            });
        });
    </script>
</body>
</html>
